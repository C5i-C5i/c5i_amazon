<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041a33"/>
      <stop offset="1" stop-color="#005f99"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="#21c7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#21c7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031426" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b35" flood-opacity=".18"/>
    </filter>
    <style>
      .glass{fill:rgba(255,255,255,.82);stroke:rgba(255,255,255,.75);stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#ffffff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .thin{fill:none;stroke:#bfe3ff;stroke-width:3;stroke-linecap:round;opacity:.8}
      .dark{fill:#071a34}.white{fill:#fff}.muted{fill:#d8ecff}.accent{fill:#21c7ff}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#ffffff;font-size:34px;letter-spacing:-.6px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#dcefff;font-size:18px}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#0a2b4d;font-size:18px}
    </style>
  </defs>
  <rect width="900" height="520" rx="0" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#glow)"/>
  <path d="M-40 430 C160 330,260 470,450 350 S750 240,960 325" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="38"/>
  <path d="M-20 410 C190 300,305 426,486 320 S740 230,935 290" fill="none" stroke="#21c7ff" stroke-opacity=".55" stroke-width="8"/>
  <text x="42" y="72" class="label">QuickSight KPI Dashboard</text>
  <text x="44" y="104" class="sub">350+ users • 25 segments • always-on access</text>
  
  <rect x="105" y="150" width="690" height="285" rx="34" class="glass"/>
  <rect x="145" y="195" width="170" height="82" rx="18" fill="#eaf6ff"/><rect x="345" y="195" width="170" height="82" rx="18" fill="#fff3df"/><rect x="545" y="195" width="210" height="82" rx="18" fill="#e7fff4"/>
  <text x="170" y="245" class="small">KPI</text><text x="390" y="245" class="small">TTM</text><text x="585" y="245" class="small">Segments</text>
  <path d="M150 362 L245 326 L350 346 L455 278 L565 300 L738 238" fill="none" stroke="#0073bb" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 385 L245 374 L350 315 L455 342 L565 276 L738 305" fill="none" stroke="#00a6a6" stroke-width="8" stroke-linecap="round"/>
  <rect x="116" y="452" width="668" height="18" rx="9" fill="#d8ecff" opacity=".7"/><rect x="116" y="452" width="480" height="18" rx="9" fill="#ff9900"/>

</svg>
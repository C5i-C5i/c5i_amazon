<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="1" stop-color="#00537a"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031426" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b35" flood-opacity=".18"/>
    </filter>
    <style>
      .glass{fill:rgba(255,255,255,.82);stroke:rgba(255,255,255,.75);stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#ffffff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .thin{fill:none;stroke:#bfe3ff;stroke-width:3;stroke-linecap:round;opacity:.8}
      .dark{fill:#071a34}.white{fill:#fff}.muted{fill:#d8ecff}.accent{fill:#22c55e}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#ffffff;font-size:34px;letter-spacing:-.6px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#dcefff;font-size:18px}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#0a2b4d;font-size:18px}
    </style>
  </defs>
  <rect width="900" height="520" rx="0" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#glow)"/>
  <path d="M-40 430 C160 330,260 470,450 350 S750 240,960 325" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="38"/>
  <path d="M-20 410 C190 300,305 426,486 320 S740 230,935 290" fill="none" stroke="#22c55e" stroke-opacity=".55" stroke-width="8"/>
  <text x="42" y="72" class="label">AWS Media Lifestyle Study</text>
  <text x="44" y="104" class="sub">media behavior tracking • 9 markets</text>
  
  <rect x="110" y="160" width="450" height="250" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="138" y="190" width="394" height="170" rx="18" fill="#0a2b4d"/>
  <circle cx="230" cy="275" r="44" fill="#ff9900" opacity=".9"/><path d="M220 248 L260 275 L220 302 Z" fill="#fff"/>
  <rect x="295" y="235" width="180" height="18" rx="9" fill="#eaf6ff"/><rect x="295" y="272" width="135" height="18" rx="9" fill="#e7fff4"/><rect x="295" y="309" width="205" height="18" rx="9" fill="#fff3df"/>
  <circle cx="665" cy="210" r="32" fill="#eaf6ff"/><circle cx="745" cy="290" r="32" fill="#e7fff4"/><circle cx="650" cy="380" r="32" fill="#fff3df"/>
  <path d="M665 242 C670 292,702 296,745 290 M725 313 C690 344,668 350,650 380" class="thin" stroke="#fff"/>
  <text x="635" y="216" class="small">TV</text><text x="728" y="296" class="small">OTT</text><text x="632" y="386" class="small">Ads</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="1" stop-color="#3b0d75"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031426" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b35" flood-opacity=".18"/>
    </filter>
    <style>
      .glass{fill:rgba(255,255,255,.82);stroke:rgba(255,255,255,.75);stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#ffffff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .thin{fill:none;stroke:#bfe3ff;stroke-width:3;stroke-linecap:round;opacity:.8}
      .dark{fill:#071a34}.white{fill:#fff}.muted{fill:#d8ecff}.accent{fill:#8b5cf6}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#ffffff;font-size:34px;letter-spacing:-.6px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#dcefff;font-size:18px}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#0a2b4d;font-size:18px}
    </style>
  </defs>
  <rect width="900" height="520" rx="0" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#glow)"/>
  <path d="M-40 430 C160 330,260 470,450 350 S750 240,960 325" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="38"/>
  <path d="M-20 410 C190 300,305 426,486 320 S740 230,935 290" fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="8"/>
  <text x="42" y="72" class="label">DSDM Conjoint Study</text>
  <text x="44" y="104" class="sub">delivery time • fee • location decision modelling</text>
  
  <rect x="105" y="170" width="205" height="230" rx="26" class="glass"/>
  <rect x="350" y="145" width="205" height="270" rx="26" class="glass"/>
  <rect x="595" y="170" width="205" height="230" rx="26" class="glass"/>
  <text x="142" y="220" class="small">Option A</text><text x="388" y="200" class="small">Option B</text><text x="632" y="220" class="small">Option C</text>
  <rect x="138" y="252" width="130" height="18" rx="9" fill="#eaf6ff"/><rect x="138" y="292" width="96" height="18" rx="9" fill="#fff3df"/><rect x="138" y="332" width="150" height="18" rx="9" fill="#e7fff4"/>
  <rect x="385" y="238" width="130" height="18" rx="9" fill="#eaf6ff"/><rect x="385" y="282" width="105" height="18" rx="9" fill="#fff3df"/><rect x="385" y="326" width="146" height="18" rx="9" fill="#e7fff4"/>
  <rect x="632" y="252" width="125" height="18" rx="9" fill="#eaf6ff"/><rect x="632" y="292" width="118" height="18" rx="9" fill="#fff3df"/><rect x="632" y="332" width="132" height="18" rx="9" fill="#e7fff4"/>
  <path d="M385 445 H515" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M505 417 L550 445 L505 473" class="line"/>

</svg>
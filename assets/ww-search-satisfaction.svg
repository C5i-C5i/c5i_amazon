<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="1" stop-color="#113c74"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="#36c8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#36c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031426" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b35" flood-opacity=".18"/>
    </filter>
    <style>
      .glass{fill:rgba(255,255,255,.82);stroke:rgba(255,255,255,.75);stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#ffffff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .thin{fill:none;stroke:#bfe3ff;stroke-width:3;stroke-linecap:round;opacity:.8}
      .dark{fill:#071a34}.white{fill:#fff}.muted{fill:#d8ecff}.accent{fill:#36c8ff}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#ffffff;font-size:34px;letter-spacing:-.6px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#dcefff;font-size:18px}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#0a2b4d;font-size:18px}
    </style>
  </defs>
  <rect width="900" height="520" rx="0" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#glow)"/>
  <path d="M-40 430 C160 330,260 470,450 350 S750 240,960 325" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="38"/>
  <path d="M-20 410 C190 300,305 426,486 320 S740 230,935 290" fill="none" stroke="#36c8ff" stroke-opacity=".55" stroke-width="8"/>
  <text x="42" y="72" class="label">WW Search Satisfaction</text>
  <text x="44" y="104" class="sub">search journey • satisfaction • AI chatbot deep dive</text>
  
  <rect x="102" y="162" width="690" height="86" rx="43" class="glass"/>
  <circle cx="153" cy="205" r="26" fill="none" stroke="#0073bb" stroke-width="10"/><path d="M173 226 L204 257" stroke="#0073bb" stroke-width="10" stroke-linecap="round"/>
  <text x="235" y="215" class="small">Search satisfaction tracking</text>
  <rect x="128" y="300" width="180" height="105" rx="18" fill="#eaf6ff" filter="url(#soft)"/><rect x="360" y="300" width="180" height="105" rx="18" fill="#e7fff4" filter="url(#soft)"/><rect x="592" y="300" width="180" height="105" rx="18" fill="#fff3df" filter="url(#soft)"/>
  <text x="178" y="355" class="small">US</text><text x="412" y="355" class="small">EU3</text><text x="633" y="355" class="small">Japan</text>
  <path d="M170 448 C260 395,326 462,420 420 S612 410,718 355" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <circle cx="718" cy="355" r="16" fill="#ff9900"/>

</svg>